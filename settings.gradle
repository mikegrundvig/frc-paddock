pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine with
    // any Java installed.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-paddock"

// PhotonVision's settings in their canonical form, the AprilTag layout's fingerprint, PhotonVision's
// lock, Paddock's build tool, and their JSON.
include "core"
// PhotonVision's settings tool, which stamping runs.
include "photonvision-pack"
project(":photonvision-pack").projectDir = file("packs/photonvision")
// The shared machinery and the recipes (shell): their tests, run by Gradle.
include "engine"
// The container tests: the real PhotonVision under systemd, set up as an image runs it.
include "harness"
