# Raspberry Pis running your own program as a service: a small Python script using OpenCV, started
# at boot. One image for every camera, each computer stamped with its own camera's settings
# (README.md). Every path here is from this file's folder.
images:
  camera:
    from:
      url: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-09-15/2026-09-15-raspios-trixie-arm64-lite.img.xz
      sha256: cdf4f3bfac35ae947b46e4e767f935453810549779ac3290e05a6754aee627e5
    steps:
      # Your program and its systemd unit, from this folder.
      - file: app/camera-check.py
        to: /opt/camera-check/camera-check.py
        mode: "0755"
      - file: app/camera-check.service
        to: /etc/systemd/system/camera-check.service
      # What the program needs from Raspberry Pi OS, and its service turned on.
      - run: setup/camera-check.sh
      # Log in as pi with your SSH keys (the same step as the raspberry-pi example's).
      - run: setup/login.sh

computers:
  # Each computer's own camera.json: which camera it opens, and that camera's calibration.
  - hostname: camera-front
    image: camera
    address: 10.0.0.31/24
    gateway: 10.0.0.4
    files:
      - file: computers/camera-front/camera.json
        to: /etc/camera-check/camera.json
  - hostname: camera-back
    image: camera
    address: 10.0.0.32/24
    gateway: 10.0.0.4
    files:
      - file: computers/camera-back/camera.json
        to: /etc/camera-check/camera.json
