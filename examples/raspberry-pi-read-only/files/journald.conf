# The journal, kept on the data partition (paddock.yaml keeps /var/log/journal) and written within
# 10 s of each message: by default journald syncs only every 5 minutes, so a power cut would lose
# the minutes that matter. Capped well under the data partition's size.
[Journal]
Storage=persistent
SystemMaxUse=128M
SyncIntervalSec=10s
