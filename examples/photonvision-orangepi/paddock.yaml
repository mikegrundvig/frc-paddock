# Vision computers: PhotonVision on an Orange Pi 5, with a read-only root so a power cut can't
# damage it, SSH by key only, and no default passwords (README.md). Every path here is from this
# file's folder.
#
# Two ways to the same computer, both built by Paddock's CI; keep the one you want:
#   vision          PhotonVision's base image (Armbian) with the PhotonVision release your robot
#                   code's PhotonLib uses downloaded in. Recommended: PhotonVision's 2027 base.
#   vision-release  PhotonVision's own release image, used as it comes. Up to 2027.0.0-alpha-2
#                   these are built on Ubuntu.
images:
  vision:
    from:
      # One per board: photonvision_opi5b, _opi5plus, _opi5pro, _opi5max.
      url: https://github.com/PhotonVision/photon-image-modifier/releases/download/v2027.2.3/photonvision_opi5.img.xz
      sha256: edf2bda3032579d759de46aab0e8094cfd3de3586ba764b663470d2b80351cb7
    grow: 1G
    steps:
      # PhotonVision itself: the release your robot code's PhotonLib uses (its release page lists
      # each file's SHA-256).
      - download: https://github.com/PhotonVision/photonvision/releases/download/v2027.0.0-alpha-2/photonvision-v2027.0.0-alpha-2-linuxarm64.jar
        sha256: 15bcc1dd2de63af38d8171121fb4124b773931ec09a14e1c404d6654d5ec6075
        to: /opt/photonvision/photonvision.jar
      # Your team's SSH public keys, for the image's login, photon.
      - file: keys/authorized_keys
        to: /home/photon/.ssh/authorized_keys
      - file: files/sshd.conf
        to: /etc/ssh/sshd_config.d/10-team.conf
      - file: files/ssh-hostkey.service
        to: /etc/systemd/system/ssh-hostkey.service
      - file: files/NetworkManager.conf
        to: /etc/NetworkManager/conf.d/90-team.conf
      - file: files/journald.conf
        to: /etc/systemd/journald.conf.d/70-team.conf
      - file: files/e2fsck.conf
        to: /etc/e2fsck.conf
      # What the base needs changed for a read-only root, NetworkManager alone, and no default
      # passwords (the script says each).
      - run: setup/photonvision-orangepi.sh
    read-only:
      # PhotonVision's settings and the journal: small. Every flash writes the whole partition.
      data: 2G
      keep: [/opt/photonvision/photonvision_config, /var/log/journal]

  vision-release:
    from:
      url: https://github.com/PhotonVision/photonvision/releases/download/v2027.0.0-alpha-2/photonvision-v2027.0.0-alpha-2-linuxarm64_orangepi5.img.xz
      sha256: 135facbcad994c34ffca02467ba85b3ab1eaf96070247278814fcdcabac807fb
    grow: 1G
    steps:
      - file: keys/authorized_keys
        to: /home/photon/.ssh/authorized_keys
      - file: files/sshd.conf
        to: /etc/ssh/sshd_config.d/10-team.conf
      - file: files/ssh-hostkey.service
        to: /etc/systemd/system/ssh-hostkey.service
      - file: files/NetworkManager.conf
        to: /etc/NetworkManager/conf.d/90-team.conf
      - file: files/journald.conf
        to: /etc/systemd/journald.conf.d/70-team.conf
      - file: files/e2fsck.conf
        to: /etc/e2fsck.conf
      - run: setup/photonvision-orangepi.sh
    read-only:
      data: 2G
      keep: [/opt/photonvision/photonvision_config, /var/log/journal]

computers:
  # About two AprilTag cameras per Orange Pi 5: a second computer for the back cameras, say.
  - hostname: vision-front
    image: vision
    address: 10.0.0.11/24        # yours: 10.TE.AM.11/24 (team 1234: 10.12.34.11/24)
    gateway: 10.0.0.4            # yours: 10.TE.AM.4
  - hostname: vision-back
    image: vision-release
    address: 10.0.0.12/24
    gateway: 10.0.0.4
