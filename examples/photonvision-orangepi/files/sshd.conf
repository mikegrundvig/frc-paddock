# SSH for photon only, by key only: your team's public keys (keys/authorized_keys). Read before any
# other drop-in and before sshd_config's own lines (the base image's says PermitRootLogin yes), so
# nothing later turns passwords or root back on: sshd keeps the first value it reads.
AllowUsers photon
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no
# The host key is this drive's own, made on the data partition at first boot (ssh-hostkey.service):
# the root is read-only, and the same on every image of a release, which anyone can download.
HostKey /data/ssh/ssh_host_ed25519_key
