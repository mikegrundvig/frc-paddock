// PhotonVision's settings tool: built from Paddock's core so a robot's build and an image's stamp
// hash PhotonVision's settings, and fingerprint its tag layout, one way. Stamping runs it as
// `photonvision-helper.jar settings-db` to build each computer's settings database from its
// committed settings. It reads and writes a SQLite database (java.sql) with its own driver: Java 17
// bytecode, so it runs on any Java from 17.
//
//   ./gradlew :photonvision-pack:jar    build/libs/photonvision-helper.jar

plugins {
    id "java"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":core")
    // PhotonVision's settings database is SQLite.
    implementation libs.sqlite.jdbc

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // PhotonVision's settings database, made from its schema, for the tests.
    testImplementation testFixtures(project(":core"))
    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED" // sqlite-jdbc loads its native library
}

// photonvision-helper.jar: the tool with everything it needs, run with `java -jar`. sqlite-jdbc's
// native libraries are kept for 64-bit ARM and x86 Linux, and no others: a fifth of the size.
def keptNatives = [
    "org/sqlite/native/Linux/aarch64",
    "org/sqlite/native/Linux/x86_64"
]
tasks.named("jar") {
    archiveFileName = "photonvision-helper.jar"
    manifest {
        attributes(
                "Main-Class": "com.michaelgrundvig.frc.paddock.photonvision.Helper",
                "Enable-Native-Access": "ALL-UNNAMED")
    }
    dependsOn configurations.runtimeClasspath
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude { element ->
            def path = element.relativePath.pathString
            path.startsWith("org/sqlite/native/") && !keptNatives.any { path.startsWith(it) || it.startsWith(path) }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

ext.nullSafePackages = "com.michaelgrundvig.frc.paddock"
apply from: rootProject.file("gradle/quality.gradle")
