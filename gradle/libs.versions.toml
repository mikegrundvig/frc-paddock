# The versions of what builds and tests Paddock: Spotless formats the integration tests' Java,
# which run on JUnit and Testcontainers.

[versions]
spotless = "8.6.0"
google-java-format = "1.28.0"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
