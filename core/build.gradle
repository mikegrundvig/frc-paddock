// Paddock's shared code: PhotonVision's settings in their canonical form and their hash, the
// AprilTag layout's fingerprint, the locks, the recipe hash, the boards, the table's PhotonVision
// rules, and Paddock's build tool. Plain Java 17 on Spotter's API, so PhotonVision's pack's helper,
// a robot's build, and the image workflow all compute these one way.

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs, as Spotter's: the pack's helper runs on a board's Java.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    api "com.michaelgrundvig.frc.spotter:api:${rootProject.spotterVersion}"

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // PhotonVision's settings database for tests (src/testFixtures): this project's, and the
    // pack's. Settings go in and out of the database through JDBC's own API (java.sql), so only
    // the tests need a driver; the pack's helper brings its own.
    testFixturesRuntimeOnly libs.sqlite.jdbc

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED" // sqlite-jdbc loads its native library
    systemProperty "frc.projectDir", rootProject.projectDir.absolutePath
}

// The build tools the image workflow runs, with java -cp 'build/tools/*': Spotter's
// (com.michaelgrundvig.frc.spotter.tools.CoprocessorBuild: agent-configs, pack) and Paddock's
// (com.michaelgrundvig.frc.paddock.tools.PaddockBuild).
tasks.register("workflowTools", Sync) {
    group = "build"
    description = "Collect the build tools' jars for the image workflow, in build/tools."
    into layout.buildDirectory.dir("tools")
    from(tasks.named("jar"))
    from(configurations.runtimeClasspath)
}

ext.nullSafePackages = "com.michaelgrundvig.frc.paddock"
apply from: rootProject.file("gradle/quality.gradle")
