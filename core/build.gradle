// Paddock's shared code: PhotonVision's settings in their canonical form and their hash, the
// AprilTag layout's fingerprint, PhotonVision's lock, the boards, Paddock's build tool, and the JSON
// they're all written in. Plain Java 17 with no dependencies, so the settings tool, a robot's
// build, and a laptop's tools all compute these one way.

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Java 17 bytecode and APIs: a robot program, a laptop, or a board may run it on its own Java.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.jspecify // @Nullable in the signatures

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // PhotonVision's settings database for tests (src/testFixtures): this project's, and the
    // settings tool's. Settings go in and out of the database through JDBC's own API (java.sql),
    // so only the tests need a driver; the settings tool brings its own.
    testFixturesRuntimeOnly libs.sqlite.jdbc

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED" // sqlite-jdbc loads its native library
    systemProperty "frc.projectDir", rootProject.projectDir.absolutePath
}

ext.nullSafePackages = "com.michaelgrundvig.frc.paddock"
apply from: rootProject.file("gradle/quality.gradle")
