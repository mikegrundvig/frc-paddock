name: Build coprocessor images

# Paddock's image workflow, which a team's repository calls (README.md, "Using Paddock"): it builds
# one image per computer in the team's table, with the recipe the table or the caller names, and,
# given a release name, publishes them as a release of the caller's repository, with SHA256SUMS,
# manifest.json, and NOTICE.md (the software in the images and where its source is). Without a
# release name, the images are this run's artifacts only, to try a change.
#
#   jobs:
#     images:
#       uses: mikegrundvig/frc-paddock/.github/workflows/build-images.yml@v1
#       permissions:
#         contents: write
#       with:
#         release: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
#
# The common image of each board is provisioned on the recipe's runner (GitHub's ARM runners for
# PhotonVision on Orange Pi: free for public repositories), natively, in a chroot of the board's
# base image (the engine's chroot-provision.sh; no third-party action runs); stamping and the release run on x86. Every input is checked against a lock:
# the recipe's (the base images and the software) and Spotter's (its agent's .deb).
on:
  workflow_call:
    inputs:
      table:
        description: "The team's table of coprocessors, from its repository's root"
        type: string
        default: coprocessors.yaml
      settings:
        description: "The team's committed settings: one folder per computer (NAME/)"
        type: string
        default: settings
      ssh-keys:
        description: "The team's SSH public keys (none there: no SSH logins)"
        type: string
        default: authorized_keys
      packs:
        description: "A folder of the team's own packs, each NAME/ with its pack.yaml (empty: none)"
        type: string
        default: ""
      provision-hook:
        description: "A script of the team's, run last as root in each common image (empty: none)"
        type: string
        default: ""
      recipe:
        description: "The recipe (empty: the table's image.recipe, else photonvision-orangepi)"
        type: string
        default: ""
      vendordep:
        description: "The robot code's PhotonLib vendordep, whose version the lock's must equal (empty: not checked)"
        type: string
        default: ""
      release:
        description: "The release to cut, such as coprocessors-2027.1 (empty: build only, no release)"
        type: string
        default: ""
      paddock-ref:
        description: "The Paddock whose engine and recipes build the images: the same as the workflow's @ref"
        type: string
        default: v1

permissions:
  contents: read

env:
  WORK: build/paddock

jobs:
  plan:
    name: Check the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      team: ${{ steps.plan.outputs.team }}
      recipe: ${{ steps.plan.outputs.recipe }}
      runner: ${{ steps.plan.outputs.runner }}
      version: ${{ steps.plan.outputs.version }}
      version-label: ${{ steps.plan.outputs.version-label }}
      recipe-hash: ${{ steps.plan.outputs.recipe-hash }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      boards: ${{ steps.plan.outputs.boards }}
      computers: ${{ steps.plan.outputs.computers }}
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: team
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikegrundvig/frc-paddock
          ref: ${{ inputs.paddock-ref }}
          path: paddock
          persist-credentials: false
      # Spotter's source at the version Paddock pins, beside Paddock's: Paddock's build tools are
      # built on its API.
      - name: Read Spotter's version
        id: spotter
        run: echo "tag=$(yq -p json -r '.tag' paddock/spotter.lock)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikegrundvig/frc-spotter
          ref: ${{ steps.spotter.outputs.tag }}
          path: frc-spotter
          persist-credentials: false
      - name: Check the table, the locks, and the release name
        id: plan
        env:
          TABLE: ${{ inputs.table }}
          RECIPE: ${{ inputs.recipe }}
          VENDORDEP: ${{ inputs.vendordep }}
          PACKS: ${{ inputs.packs }}
          HOOK: ${{ inputs.provision-hook }}
          RELEASE: ${{ inputs.release }}
          SHA: ${{ github.sha }}
        run: |
          args=(--table "team/$TABLE" --recipe "$RECIPE" --release "$RELEASE" --sha "$SHA")
          if [[ -n $VENDORDEP ]]; then args+=(--vendordep "team/$VENDORDEP"); fi
          if [[ -n $HOOK ]]; then args+=(--hook "team/$HOOK"); fi
          if [[ -n $PACKS ]]; then
            for pack in "team/$PACKS"/*/; do args+=(--pack "${pack%/}"); done
          fi
          mkdir -p "$WORK"
          set -o pipefail
          paddock/engine/plan.sh "${args[@]}" 2>&1 | tee -a "$WORK/job.log"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The tools the other jobs need, in one artifact: PhotonVision's pack and its helper (the
      # settings tool), the team's packs with their pack.json, its hook, and each computer's agent
      # configuration, written by Spotter's build tool from the table.
      - name: Build the packs and the agent's configurations
        env:
          TABLE: ${{ inputs.table }}
          PACKS: ${{ inputs.packs }}
          HOOK: ${{ inputs.provision-hook }}
        run: |
          set -o pipefail
          (cd paddock && ./gradlew :photonvision-pack:packFolder :core:workflowTools) 2>&1 | tee -a "$WORK/job.log"
          tools=$WORK/tools
          mkdir -p "$tools/packs" "$tools/agent-configs" "$WORK/repository/coprocessors"
          cp -R paddock/packs/photonvision/build/pack/photonvision "$tools/packs/"
          cp paddock/packs/photonvision/build/pack/photonvision/lib/photonvision-helper.jar "$tools/"
          if [[ -n $PACKS ]]; then
            for pack in "team/$PACKS"/*/; do
              name=$(basename "$pack")
              cp -R "$pack" "$tools/packs/$name"
              java -cp 'paddock/core/build/tools/*' com.michaelgrundvig.frc.spotter.tools.CoprocessorBuild \
                pack "$pack/pack.yaml" "$tools/packs/$name/pack.json"
            done
          fi
          if [[ -n $HOOK ]]; then cp "team/$HOOK" "$tools/hook.sh"; fi
          cp "team/$TABLE" "$WORK/repository/coprocessors/coprocessors.yaml"
          java -cp 'paddock/core/build/tools/*' com.michaelgrundvig.frc.spotter.tools.CoprocessorBuild \
            agent-configs "$WORK/repository" "$tools/agent-configs"
          ls -R "$tools"
      # Why it failed, as an annotation beside the run, where it's read without the full log.
      - name: Say why it failed
        if: failure()
        run: |
          if [ -f "$WORK/job.log" ]; then
            tail -n 60 "$WORK/job.log" | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=${{ github.job }}::"+t)'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools/
          if-no-files-found: error
          retention-days: 3

  common:
    name: Common image (${{ matrix.board }})
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikegrundvig/frc-paddock
          ref: ${{ inputs.paddock-ref }}
          path: paddock
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools
      # The base image, the recipe's inputs, and Spotter's .deb, each checked against its lock.
      - name: Download the inputs, checked against the locks
        env:
          RECIPE: ${{ needs.plan.outputs.recipe }}
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p "$WORK"
          set -o pipefail
          paddock/engine/fetch.sh --recipe-dir "paddock/recipes/$RECIPE" --board "$BOARD" \
            --spotter-lock paddock/spotter.lock --out "$WORK/inputs" 2>&1 | tee -a "$WORK/job.log"
      # The base image's root grown, and the recipe's provisioning run in a chroot of it, natively
      # (the engine's chroot-provision.sh), with the workspace at /tmp/build. The recipe and the
      # board were checked by plan.sh; the packs and the hook are files of fixed names.
      - name: Provision the common image
        env:
          RECIPE: ${{ needs.plan.outputs.recipe }}
          BOARD: ${{ matrix.board }}
          FREE_MB: ${{ matrix.minimumFreeMb }}
        run: |
          exec > >(tee -a "$WORK/job.log") 2>&1
          xz -dc "$WORK/inputs/base.img.xz" >"$WORK/common.img"
          rm "$WORK/inputs/base.img.xz"
          partition=$(. "paddock/recipes/$RECIPE/boards/$BOARD.env" && echo "$BOARD_ROOT_PARTITION")
          args=(--board "$BOARD" --inputs "$WORK/inputs/inputs"
            --agent-deb "$WORK/inputs/inputs/frc-spotter.deb" --out "$WORK/smoketest")
          for pack in "$WORK"/tools/packs/*/; do args+=(--pack "${pack%/}"); done
          if [ -f "$WORK/tools/hook.sh" ]; then args+=(--hook "$WORK/tools/hook.sh"); fi
          sudo paddock/engine/chroot-provision.sh --image "$WORK/common.img" \
            --root-partition "$partition" --grow-mb "$FREE_MB" --bind . -- \
            bash "paddock/recipes/$RECIPE/provision.sh" "${args[@]}"
      - name: Pack the common image and what stamping needs
        env:
          BOARD: ${{ matrix.board }}
        run: |
          IMAGE=$WORK/common.img
          mkdir -p "$WORK/common"
          # Its checksum goes into the release's manifest, beside each computer stamped from it.
          sudo sha256sum "$IMAGE" | cut -c1-64 >"$WORK/common/common-$BOARD.sha256"
          sudo cat "$IMAGE" | xz -T0 -1 >"$WORK/common/common-$BOARD.img.xz"
          # What provisioning left for stamping (the empty settings database), as the runner's.
          if [ -d "$WORK/smoketest/photonvision_config" ]; then
            sudo install -m 0644 -o "$(id -u)" -g "$(id -g)" \
              "$WORK/smoketest/photonvision_config/photon.sqlite" "$WORK/common/empty-photon.sqlite"
          fi
          sudo rm -f "$IMAGE"
      # Why it failed, as an annotation beside the run, where it's read without the full log.
      - name: Say why it failed
        if: failure()
        run: |
          if [ -f "$WORK/job.log" ]; then
            tail -n 60 "$WORK/job.log" | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=${{ github.job }}::"+t)'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-${{ matrix.board }}
          path: ${{ env.WORK }}/common/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  stamp:
    name: Stamp ${{ matrix.name }}
    needs: [plan, common]
    # Stamping writes files and runs no image code: any runner will do.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.computers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: team
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikegrundvig/frc-paddock
          ref: ${{ inputs.paddock-ref }}
          path: paddock
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: common-${{ matrix.board }}
          path: ${{ env.WORK }}/common
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools
      - name: Lay out and stamp ${{ matrix.name }}'s image
        env:
          NAME: ${{ matrix.name }}
          BOARD: ${{ matrix.board }}
          TEAM: ${{ needs.plan.outputs.team }}
          RECIPE: ${{ needs.plan.outputs.recipe }}
          VERSION: ${{ needs.plan.outputs.version }}
          VERSION_LABEL: ${{ needs.plan.outputs.version-label }}
          RELEASE: ${{ needs.plan.outputs.release }}
          RECIPE_HASH: ${{ needs.plan.outputs.recipe-hash }}
          TABLE: ${{ inputs.table }}
          SETTINGS: ${{ inputs.settings }}
          KEYS: ${{ inputs.ssh-keys }}
        run: |
          mkdir -p "$WORK"
          exec > >(tee -a "$WORK/job.log") 2>&1
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends fdisk dosfstools
          base="$TEAM-$NAME-$RELEASE"
          mkdir -p "$WORK/out" "$WORK/inputs"
          # What the recipe's stamp step uses: the empty settings database, and the settings tool,
          # PhotonVision's pack's helper.
          if [ -f "$WORK/common/empty-photon.sqlite" ]; then
            cp "$WORK/common/empty-photon.sqlite" "$WORK/inputs/"
          fi
          printf '#!/bin/sh\nexec java -jar %s settings-db "$@"\n' \
            "$PWD/$WORK/tools/photonvision-helper.jar" >"$WORK/inputs/settings-tool"
          chmod +x "$WORK/inputs/settings-tool"
          xz -dc "$WORK/common/common-$BOARD.img.xz" >"$WORK/$base.img"
          echo "$(cat "$WORK/common/common-$BOARD.sha256")  $WORK/$base.img" | sha256sum --check --strict
          cp "$WORK/common/common-$BOARD.sha256" "$WORK/out/$base.common-sha256"
          paddock/engine/layout.sh --recipe-dir "paddock/recipes/$RECIPE" --board "$BOARD" "$WORK/$base.img"
          built=$(date -u -d "@$(git -C team log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
          # As root, to mount the image; with this PATH, for yq and the settings tool's Java.
          sudo env "PATH=$PATH" paddock/engine/stamp-image.sh --recipe-dir "paddock/recipes/$RECIPE" \
            --board "$BOARD" "$WORK/$base.img" -- \
            --computer "$NAME" --table "team/$TABLE" --release "$RELEASE" --recipe-hash "$RECIPE_HASH" \
            --agent-config "$WORK/tools/agent-configs/$NAME.json" --label "$VERSION_LABEL=$VERSION" \
            --label "board=$BOARD" --built-at "$built" --keys "team/$KEYS" --settings "team/$SETTINGS" \
            --inputs "$WORK/inputs" --stamp-out "$WORK/out/$base.stamp.json"
          sudo chown "$(id -u):$(id -g)" "$WORK/out/$base.stamp.json"
          xz -T0 -c "$WORK/$base.img" >"$WORK/out/$base.img.xz"
          rm "$WORK/$base.img"
      # Why it failed, as an annotation beside the run, where it's read without the full log.
      - name: Say why it failed
        if: failure()
        run: |
          if [ -f "$WORK/job.log" ]; then
            tail -n 60 "$WORK/job.log" | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=${{ github.job }}::"+t)'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: ${{ env.WORK }}/out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [plan, stamp]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikegrundvig/frc-paddock
          ref: ${{ inputs.paddock-ref }}
          path: paddock
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ env.WORK }}/release
      - name: Write NOTICE.md, SHA256SUMS, and manifest.json
        env:
          RECIPE: ${{ needs.plan.outputs.recipe }}
          BOARDS: ${{ needs.plan.outputs.boards }}
        run: |
          mkdir -p "$WORK"
          exec > >(tee -a "$WORK/job.log") 2>&1
          boards=$(yq -p json -o yaml -r '.[].board' <<<"$BOARDS" | paste -sd ' ')
          "paddock/recipes/$RECIPE/notice.sh" --boards "$boards" --spotter-lock paddock/spotter.lock \
            >"$WORK/release/NOTICE.md"
          paddock/engine/manifest.sh "$WORK/release"
          cat "$WORK/release/NOTICE.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ env.WORK }}/release/NOTICE.md
            ${{ env.WORK }}/release/SHA256SUMS
            ${{ env.WORK }}/release/manifest.json
          retention-days: 7
      # Only in the team's own repository, never a fork's, and only when a release was asked for;
      # a release is never replaced.
      - name: Cut the release
        if: needs.plan.outputs.publish == 'true' && !github.event.repository.fork
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.plan.outputs.release }}
          VERSION: ${{ needs.plan.outputs.version }}
          RECIPE: ${{ needs.plan.outputs.recipe }}
        run: |
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE already exists, and a release is never replaced."
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE != tag ]] && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE" >/dev/null 2>&1; then
            # The tag is made here, at the commit this run built.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          {
            echo "Coprocessor images ($RECIPE, $VERSION), one per computer."
            echo "Check a download against SHA256SUMS before flashing it. NOTICE.md names the software in them and where its source is."
            echo
            echo "| Computer | Address | Board | Image |"
            echo "|---|---|---|---|"
            yq -r '.computers[] | "| " + .name + " | " + .address + " | " + (.labels.board // "") + " | " + .image + " |"' \
              "$WORK/release/manifest.json"
          } >"$WORK/notes.md"
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Coprocessor images $RELEASE" --notes-file "$WORK/notes.md" \
            "$WORK/release"/*.img.xz "$WORK/release/SHA256SUMS" "$WORK/release/manifest.json" \
            "$WORK/release/NOTICE.md"
      # Why it failed, as an annotation beside the run, where it's read without the full log.
      - name: Say why it failed
        if: failure()
        run: |
          if [ -f "$WORK/job.log" ]; then
            tail -n 60 "$WORK/job.log" | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=${{ github.job }}::"+t)'
          fi
